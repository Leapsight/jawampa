plugins {
    id 'java-library'
    // id 'com.jfrog.artifactory' version '4.14.1'
    id 'maven-publish'
}

repositories {
    jcenter()
    mavenCentral()
}

dependencies {

    implementation 'io.netty:netty-codec-http:4.2.8.Final'
    implementation 'io.netty:netty-handler:4.2.8.Final'
    implementation 'io.reactivex:rxjava:1.3.8'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.20.1'
    implementation 'org.msgpack:jackson-dataformat-msgpack:0.9.10'

    // libsodium
    implementation "com.goterl:lazysodium-java:5.1.4"
    implementation "net.java.dev.jna:jna:5.12.1"

    // Test dependencies
    testImplementation 'junit:junit:4.13.1'
}

compileJava {
    targetCompatibility = 11
    sourceCompatibility = 11
}

java {
    disableAutoTargetJvm()
}

group = 'com.leapsight'
version = System.getenv('JAR_VERSION')


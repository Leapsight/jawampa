plugins {
    id 'java-library'
    // id 'com.jfrog.artifactory' version '4.14.1'
    id 'maven-publish'
}

repositories {
    mavenCentral()
}

dependencies {

    implementation 'io.netty:netty-all:4.2.15.Final'
    implementation 'io.reactivex:rxjava:1.3.8'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.1'
    implementation 'org.msgpack:jackson-dataformat-msgpack:0.9.12'

    // libsodium
    implementation "com.goterl:lazysodium-java:5.1.4" //5.2.0
    implementation "net.java.dev.jna:jna:5.12.1" //5.18.1 ??

    // Test dependencies
    testImplementation 'junit:junit:4.13.1'
}

compileJava {
    targetCompatibility = 11
    sourceCompatibility = 11
}

java {
    disableAutoTargetJvm()
    withSourcesJar()
    withJavadocJar()
}

group = 'com.leapsight'

version = System.getenv('JAR_VERSION')

jar {
    archiveBaseName.set('jawampa-wl')
    // archiveVersion is inherited from project.version
}

